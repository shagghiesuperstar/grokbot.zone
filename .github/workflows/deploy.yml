name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4 # Astro 7 needs >= 22.23.4; the runner's cached 22.x can be older
      - run: corepack enable && corepack prepare pnpm@10.11.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:deploy
      - run: pnpm check:counts
      - run: pnpm check:contrast

  # Manual only, from main: pushes build and check but never deploy, because deploys need
  # credentials. The token is visible to the check and wrangler steps only, never to install or build.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set for this repository, so there is nothing to deploy with. Skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4 # Astro 7 needs >= 22.23.4; the runner's cached 22.x can be older
      - if: steps.creds.outputs.present == 'true'
        run: corepack enable && corepack prepare pnpm@10.11.1 --activate
      - if: steps.creds.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.present == 'true'
        run: pnpm build
      - if: steps.creds.outputs.present == 'true'
        run: pnpm run gate:deploy
      - if: steps.creds.outputs.present == 'true'
        name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.toml
      - if: steps.creds.outputs.present == 'true'
        run: scripts/verify-live.sh https://grokbot.zone
