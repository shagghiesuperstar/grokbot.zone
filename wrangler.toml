name = "grokbot-zone"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "grokbot.zone",     custom_domain = true },
  { pattern = "www.grokbot.zone", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "grokbot-zone"
database_id = "a24fa857-a56c-41ef-9fbf-d34337083a7a"

[[send_email]]
name = "EMAIL"

# NOTIFY_OWNER ([[send_email]] with destination_address) is added by the operator once the
# owner mailbox is known; the Worker runs without it.

[[ratelimits]]
name = "SUBMISSIONS_RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SUBSCRIBE_RL"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Bearer writes. Higher than the anonymous caps so a token raises the ceiling. The Worker still
# calls these on every valid bearer, so one IP cannot skip a per-IP floor by minting tokens.
[[ratelimits]]
name = "AUTH_SUBMIT_RL"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AUTH_SUBSCRIBE_RL"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[triggers]
# The digest keeps its own expression (dark); */10 is the data plane (spec 07 D14).
crons = ["0 13 * * MON,THU", "*/10 * * * *"]

# Dark-ship switches: "1" turns a feature on. Submissions (form + email) are on since 2026-11-01;
# subscriptions and the digest are on since 2026-11-02.
[vars]
FORM_SUBMIT_ENABLED  = "1"
EMAIL_SUBMIT_ENABLED = "1"
SUBSCRIBE_ENABLED    = "1"
DIGEST_ENABLED       = "1"
OWNER_ADDRESS        = ""
# Acknowledgment mails (email + form) per UTC day across all senders; over budget the submission is stored and nothing is sent.
ACK_DAILY_BUDGET     = "200"
MIN_FILL_MS          = "3000"
DIGEST_MAX_SENDS     = "100"
# MAIL_POSTAL_ADDRESS is intentionally unset (operator decision): the footer address line is omitted.
# First-party telemetry starts counting here: the UTC date of the production deploy (spec 07 D20, O4).
TELEMETRY_START      = "2026-11-01"
